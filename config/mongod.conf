# MongoDB 配置文件 — TradingAgents-CN 本地部署模式
# 由 scripts/local-services.sh 加载，绝不被 brew services 接管
#
# 设计要点：
# - 数据路径 ./data/mongodb：项目本地隔离，与其他项目/系统 mongo 不冲突
# - bindIp 127.0.0.1：loopback 铁律（OpenSpec capability loopback-binding-policy）
# - port 54302：fork 端口段位 54300-54309
# - cacheSizeGB 0.25：限制 WiredTiger 内存占用，本地单用户场景足够
# - fork false：前台运行，由 scripts/local-services.sh 通过 PID 文件管理

storage:
  dbPath: ./data/mongodb
  wiredTiger:
    engineConfig:
      # 0.5 GB cache：本地 dev 个人单用户场景，stock_daily_quotes 1.3 GB
      # 之前 0.25 GB 太小（vs 实际数据量），频繁 eviction（实测 3924/s）；
      # 0.5 GB 让常用索引 / hot pages 留 cache 内，业务 query 命中率提升。
      # 机器有 2.4 GB inactive 余量，无内存压力。
      cacheSizeGB: 0.5

net:
  bindIp: 127.0.0.1
  port: 54302
  maxIncomingConnections: 100

security:
  authorization: enabled

systemLog:
  destination: file
  path: ./logs/mongod.log
  logAppend: true
  # rename：SIGUSR1 / db.adminCommand({logRotate:1}) 时 mongod 自管理 rename
  # 当前 log → mongod.log.<ISO timestamp>，新建 mongod.log；reopen 模式需外部 logrotate(8) 协调
  # fork 不装外部 logrotate，统一用 rename + `just clean`（调 scripts/clean-local-cruft.sh）触发
  logRotate: rename
  # quiet: true 抑制 connection accepted / disconnected 等噪声日志
  # 不影响 slow query / 错误 / 启动信息记录；mongod.log 之前 565 MB 主因是 connection churn
  # （应用层 totalCreated=13678/5.7h），quiet 后写入率显著降低
  quiet: true
  verbosity: 0

processManagement:
  fork: false

setParameter:
  enableLocalhostAuthBypass: false
